<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scriptly – AI scripts for YouTubers</title>
<style>
:root{--bg:#f7f7fb;--surface:#fff;--ink:#14142b;--muted:#6b6b85;--line:#e6e6f0;--brand:#5b4bff;--brand2:#9b5cff;--brand-ink:#fff;--soft:#eeecff;--dir:#8a5a00;--dirbg:#fff6e0;--shadow:0 1px 2px rgba(20,20,43,.05),0 8px 24px rgba(20,20,43,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e18;--surface:#171726;--ink:#f1f1fa;--muted:#9a9ab5;--line:#2a2a40;--soft:#25234d;--dir:#f2c779;--dirbg:#2a2312;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0e18;--surface:#171726;--ink:#f1f1fa;--muted:#9a9ab5;--line:#2a2a40;--soft:#25234d;--dir:#f2c779;--dirbg:#2a2312;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:0 auto;padding:20px 20px 60px}
nav{display:flex;align-items:center;justify-content:space-between;padding:8px 0 28px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:-.02em}
.logo i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;color:#fff;font-style:normal;font-size:15px}
.pill{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:4px 10px;border-radius:99px;background:var(--surface)}
h1{font-size:clamp(30px,5vw,46px);line-height:1.1;letter-spacing:-.035em;margin:0 0 12px;max-width:640px}
h1 span{background:linear-gradient(90deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);max-width:560px;margin:0 0 32px;font-size:17px}
.grid{display:grid;grid-template-columns:380px 1fr;gap:24px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}
label.h{display:block;font-size:13px;font-weight:600;margin:0 0 8px}
.field{margin-bottom:22px}
textarea{width:100%;min-height:120px;resize:vertical;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;outline:none}
textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 13px;border-radius:99px;font:inherit;font-size:14px;cursor:pointer}
.chip:hover{border-color:var(--brand)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.go{width:100%;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:600;font-size:16px;color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2));cursor:pointer;box-shadow:0 6px 18px rgba(91,75,255,.35)}
.go:disabled{opacity:.6;cursor:wait}
.out{min-height:420px}
.empty{display:grid;place-items:center;text-align:center;color:var(--muted);min-height:380px;padding:20px}
.empty b{display:block;color:var(--ink);font-size:18px;margin:8px 0 4px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.bar h2{margin:0;font-size:22px;letter-spacing:-.02em}
.meta{color:var(--muted);font-size:13px;margin-bottom:16px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer}
.btn:hover{border-color:var(--brand)}
.sec{border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px;background:var(--bg)}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand);background:var(--soft);padding:3px 9px;border-radius:99px;margin-bottom:8px}
.sec p{margin:0 0 10px}
.sec p:last-child{margin:0}
.dir{font-size:13.5px;color:var(--dir);background:var(--dirbg);padding:6px 10px;border-radius:8px}
.err{color:#d6336c;padding:12px 0}
.cursor{display:inline-block;width:8px;height:16px;background:var(--brand);vertical-align:-2px;animation:b 1s steps(2) infinite}
@keyframes b{50%{opacity:0}}
</style>
</head>
<body>
<div class="wrap">
  <nav><div class="logo"><i>✦</i>Scriptly</div><span class="pill">AI script studio</span></nav>
  <h1>Turn a rough idea into a <span>ready-to-film script.</span></h1>
  <p class="sub">Paste your video idea, pick your audience and length, and get a hook, structured sections and a call to action in seconds.</p>

  <div class="grid">
    <div class="panel">
      <div class="field"><label class="h" for="idea">Your video idea</label>
        <textarea id="idea" placeholder="e.g. I tried waking up at 5am for 30 days and tracked what happened to my productivity"></textarea></div>
      <div class="field"><label class="h">Target audience</label><div class="chips" id="aud"></div></div>
      <div class="field"><label class="h">Video length</label><div class="chips" id="len"></div></div>
      <div class="field"><label class="h">Tone</label><div class="chips" id="tone"></div></div>
      <div class="field"><label class="h" for="code">Access code</label><input id="code" type="password" placeholder="Ask the owner for the test code" style="width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:11px 14px;font:inherit"></div>
      <button class="go" id="go">Generate script</button>
    </div>
    <div class="panel out" id="out">
      <div class="empty"><div><div style="font-size:34px">🎬</div><b>Your script will appear here</b>Fill in the form and hit Generate.</div></div>
    </div>
  </div>
</div>

<script>
var OPTS={
  aud:["Beginners","Students","Gamers","Entrepreneurs","Parents","Tech enthusiasts","General audience"],
  len:[["1–2 min",300],["5 min",750],["10 min",1500],["15 min",2250]],
  tone:["Conversational","Energetic","Educational","Funny","Cinematic"]
};
var S={aud:"Beginners",len:1,tone:"Conversational"};
var raw="";

function chips(id,items,key,isIdx){
  var box=document.getElementById(id);
  items.forEach(function(it,i){
    var b=document.createElement("button");
    b.type="button";b.className="chip";
    b.textContent=isIdx?it[0]:it;
    var val=isIdx?i:it;
    b.setAttribute("aria-pressed",S[key]===val?"true":"false");
    b.onclick=function(){
      S[key]=val;
      box.querySelectorAll(".chip").forEach(function(c){c.setAttribute("aria-pressed","false")});
      b.setAttribute("aria-pressed","true");
    };
    box.appendChild(b);
  });
}
chips("aud",OPTS.aud,"aud");
chips("len",OPTS.len,"len",true);
chips("tone",OPTS.tone,"tone");

function esc(t){return t}

function render(text,busy){
  var out=document.getElementById("out");
  out.textContent="";
  var title="Your script";
  var m=text.match(/^#\s+(.+)$/m);
  if(m)title=m[1].trim();
  var bar=document.createElement("div");bar.className="bar";
  var h=document.createElement("h2");h.textContent=title;bar.appendChild(h);
  var cp=document.createElement("button");cp.className="btn";cp.textContent="Copy script";
  cp.onclick=function(){
    var plain=text.replace(/^#+\s*/gm,"");
    try{navigator.clipboard.writeText(plain).then(function(){cp.textContent="Copied ✓";setTimeout(function(){cp.textContent="Copy script"},1800)},function(){cp.textContent="Copy blocked"})}catch(e){cp.textContent="Copy blocked"}
  };
  bar.appendChild(cp);out.appendChild(bar);
  var words=text.split(/\s+/).filter(Boolean).length;
  var meta=document.createElement("div");meta.className="meta";
  meta.textContent=words+" words · about "+Math.max(1,Math.round(words/150))+" min spoken";
  out.appendChild(meta);
  var parts=text.split(/^##\s+/m).slice(1);
  parts.forEach(function(p,i){
    var lines=p.split("\n");
    var sec=document.createElement("div");sec.className="sec";
    var tag=document.createElement("span");tag.className="tag";tag.textContent=lines.shift().trim();
    sec.appendChild(tag);
    lines.forEach(function(l){
      l=l.trim();if(!l)return;
      var el=document.createElement("p");
      if(l.charAt(0)==="["){el.className="dir"}
      el.textContent=l;
      sec.appendChild(el);
    });
    if(busy&&i===parts.length-1){var c=document.createElement("span");c.className="cursor";sec.lastChild&&sec.lastChild.appendChild(c)}
    out.appendChild(sec);
  });
}

function showMsg(msg){
  var out=document.getElementById("out");out.textContent="";
  var d=document.createElement("div");d.className="err";d.textContent=msg;out.appendChild(d);
}

document.getElementById("go").onclick=async function(){
  var idea=document.getElementById("idea").value.trim();
  if(!idea){showMsg("Add a video idea first, even a rough one works.");return}
  var btn=this;btn.disabled=true;btn.textContent="Writing your script…";
  raw="";
  try{
    var r=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({idea:idea,audience:S.aud,lengthIdx:S.len,tone:S.tone,code:document.getElementById("code").value})});
    if(!r.ok){var j={};try{j=await r.json()}catch(e){}showMsg(j.error||"Something went wrong. Please try again.");btn.disabled=false;btn.textContent="Generate script";return}
    var rd=r.body.getReader(),dec=new TextDecoder();
    while(true){var x=await rd.read();if(x.done)break;raw+=dec.decode(x.value,{stream:true});render(raw,true)}
    render(raw,false);
  }catch(e){
    if(raw)render(raw,false);else showMsg("Could not reach the server. Check your connection and try again.");
  }
  btn.disabled=false;btn.textContent="Generate script";
};
</script>
</body>
</html>
